
name: Website Downloader

on:
  workflow_dispatch:
  push:
    paths:
      - target.txt
      - website_cloner.py
      - requirements.txt
      - .github/workflows/website-downloader.yml

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Read target URL
        id: target
        shell: bash
        run: |
          URL="$(head -n 1 target.txt | tr -d '\r')"

          if [[ ! "$URL" =~ ^https?:// ]]; then
            echo "Error: target.txt must contain a valid HTTP or HTTPS URL."
            exit 1
          fi

          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Clone website
        id: clone
        env:
          TARGET_URL: ${{ steps.target.outputs.url }}
        shell: bash
        run: |
          OUTPUT_DIR="$(python -c \
            'import sys, urllib.parse; print(urllib.parse.urlsplit(sys.argv[1]).hostname or "cloned_site")' \
            "$TARGET_URL")"

          echo "output_dir=$OUTPUT_DIR" >> "$GITHUB_OUTPUT"

          python website_cloner.py "$TARGET_URL" \
            --output "$OUTPUT_DIR" \
            --depth 2 \
            --max-resources 2000

      - name: Verify downloaded website
        env:
          OUTPUT_DIR: ${{ steps.clone.outputs.output_dir }}
        run: |
          if [ ! -d "$OUTPUT_DIR" ]; then
            echo "Error: Website output folder was not created."
            exit 1
          fi

          if [ -z "$(find "$OUTPUT_DIR" -type f -print -quit)" ]; then
            echo "Error: Website output folder is empty."
            exit 1
          fi

          echo "Website downloaded successfully to: $OUTPUT_DIR"
          find "$OUTPUT_DIR" -maxdepth 2 -type f | head -50

      - name: Upload downloaded website folder
        uses: actions/upload-artifact@v4
        with:
          name: website-download
          path: ${{ steps.clone.outputs.output_dir }}/
          if-no-files-found: error
          retention-days: 7
