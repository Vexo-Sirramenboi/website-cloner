
name: Website Downloader

on:
  workflow_dispatch:
  push:
    paths:
      - target.txt
      - website_cloner.py
      - requirements.txt
      - .github/workflows/website-downloader.yml

permissions:
  contents: write

concurrency:
  group: website-downloader-${{ github.ref }}
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Read target URL
        id: target
        shell: bash
        run: |
          set -euo pipefail

          URL="$(head -n 1 target.txt | tr -d '\r')"

          if [[ ! "$URL" =~ ^https?:// ]]; then
            echo "Error: target.txt must contain an HTTP or HTTPS URL."
            exit 1
          fi

          python - "$URL" <<'PY'
          import sys
          from urllib.parse import urlsplit

          url = sys.argv[1]
          parsed = urlsplit(url)

          if (
              parsed.scheme not in ("http", "https")
              or not parsed.hostname
              or parsed.username
              or parsed.password
          ):
              raise SystemExit("Error: Invalid or unsafe target URL.")
          PY

          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Clone website
        id: clone
        env:
          TARGET_URL: ${{ steps.target.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT_DIR="$(python -c \
            'import sys, urllib.parse; print(urllib.parse.urlsplit(sys.argv[1]).hostname or "cloned_site")' \
            "$TARGET_URL")"

          echo "output_dir=$OUTPUT_DIR" >> "$GITHUB_OUTPUT"

          python website_cloner.py "$TARGET_URL" \
            --output "$OUTPUT_DIR" \
            --depth 10 \
            --max-resources 20000 \
            --delay 0.25 \
            --timeout 30

      - name: Commit website to repository
        if: success()
        env:
          OUTPUT_DIR: ${{ steps.clone.outputs.output_dir }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f -- "$OUTPUT_DIR"

          if git diff --cached --quiet; then
            echo "No website changes to commit."
          else
            git commit -m "Update downloaded website"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
